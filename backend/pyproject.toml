[project]
name = "sparrow"
version = "0.1.0"
description = "Agent harness that builds business websites from a brief and real source material."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "jsonpatch>=1.33",
    "playwright>=1.49",
    "python-dotenv>=1.0",
    "openai>=3.3.1",
    "pillow>=12.3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
sparrow = "sparrow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparrow"]
